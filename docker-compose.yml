services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meeting_intelligence
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://meeting:meeting@db:5432/meeting_intelligence}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - audio_data:/data/audio
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.runner"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://meeting:meeting@db:5432/meeting_intelligence}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - audio_data:/data/audio
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:-}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:-}
        VITE_ENTRA_API_SCOPE: ${VITE_ENTRA_API_SCOPE:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  audio_data:
